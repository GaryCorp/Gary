name: ai-calendar-assistant

services:
  backend:
    build:
      context: ./backend
      args:
        APP_UID: "${HOST_UID:-1000}"
        APP_GID: "${HOST_GID:-1000}"

    restart: unless-stopped

    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}"
      SESSION_SECRET: "${SESSION_SECRET:?Run bash setup.sh}"
      TOKEN_ENCRYPTION_KEY: "${TOKEN_ENCRYPTION_KEY:?Run bash setup.sh}"
      # Optional: without it Catherine's card cannot be added.
      CARD_ENCRYPTION_KEY: "${CARD_ENCRYPTION_KEY:-}"
      VOICE_BRIDGE_TOKEN: "${VOICE_BRIDGE_TOKEN:?Run bash setup.sh}"

      OPENAI_REALTIME_MODEL: "${OPENAI_REALTIME_MODEL:-gpt-realtime-2.1}"
      # transcribe: local wake word, then transcription + a text model.
      # realtime: the original single Realtime session.
      VOICE_MODE: "${VOICE_MODE:-transcribe}"
      VOICE_TRANSCRIBE_MODEL: "${VOICE_TRANSCRIBE_MODEL:-}"
      VOICE_TEXT_MODEL: "${VOICE_TEXT_MODEL:-}"
      LOCAL_TIMEZONE: "${LOCAL_TIMEZONE:-America/Chicago}"
      WAKE_WORD: "${WAKE_WORD:-gary}"
      EMAIL_CHECK_INTERVAL_MINUTES: "${EMAIL_CHECK_INTERVAL_MINUTES:-60}"
      EMAIL_CHECK_QUIET_HOURS: "${EMAIL_CHECK_QUIET_HOURS-22-7}"

      # Joplin Web Clipper API, reached through the joplin-proxy service.
      JOPLIN_TOKEN: "${JOPLIN_TOKEN:-}"
      JOPLIN_API_URL: "http://${ASSISTANT_GATEWAY:-172.30.99.1}:41184"
      JOPLIN_NOTEBOOK: "${JOPLIN_NOTEBOOK:-Gary}"

      # Chief of Staff operations database (SQLite) and its daily backups.
      GARY_DB_PATH: /data/gary.db
      GARY_BACKUP_DIR: /data/backups
      GARY_BACKUP_KEEP: "${GARY_BACKUP_KEEP:-14}"
      OPS_CHECK_INTERVAL_MINUTES: "${OPS_CHECK_INTERVAL_MINUTES:-5}"
      SPOKEN_DELIVERY_SECONDS: "${SPOKEN_DELIVERY_SECONDS:-60}"
      MAX_DAILY_AI_SPEND_USD: "${MAX_DAILY_AI_SPEND_USD:-10.00}"
      WEEKLY_REVIEW_DAY: "${WEEKLY_REVIEW_DAY:-4}"
      REQUIRE_PRICED_MODELS: "${REQUIRE_PRICED_MODELS:-true}"

      # Scheduled planning cycle. Set PLANNING_TIMES empty to turn it off.
      PLANNING_TIMES: "${PLANNING_TIMES-morning=08:00,midday=12:30,evening=17:30}"
      PLANNING_WEEKDAYS: "${PLANNING_WEEKDAYS:-mon,tue,wed,thu,fri}"
      PLANNING_MODEL: "${PLANNING_MODEL:-gpt-5.6-luna}"
      PLANNING_MAX_ACTIONS: "${PLANNING_MAX_ACTIONS:-5}"
      WORK_HOURS: "${WORK_HOURS:-9-17}"
      PROTECTED_TIMES: "${PROTECTED_TIMES-12:00-13:00}"
      PLANNING_EMAIL: "${PLANNING_EMAIL:-snippets}"

      # Read-only admin key with the api.usage.read scope, so Catherine can
      # read what OpenAI actually billed. Optional: without it, costs are
      # estimated from the price table instead.
      OPENAI_ADMIN_KEY: "${OPENAI_ADMIN_KEY:-}"
      GARY_MODEL_PRICES_FILE: /data/model_prices.json

      # Continuous operation: how often Gary checks whether anything changed
      # between the scheduled cycles. 0 leaves only the three daily cycles.
      MANAGEMENT_TICK_MINUTES: "${MANAGEMENT_TICK_MINUTES:-15}"
      MAX_MANAGEMENT_CYCLES_PER_DAY: "${MAX_MANAGEMENT_CYCLES_PER_DAY:-24}"
      # Defaults to PLANNING_WEEKDAYS; set all seven days to run through a weekend.
      MANAGEMENT_WEEKDAYS: "${MANAGEMENT_WEEKDAYS-}"
      PRINCIPAL_NAME: "${PRINCIPAL_NAME:-Alex}"
      # Gary's own Gmail account, signed in at /login/gary. Empty = none.
      GARY_EMAIL_ADDRESS: "${GARY_EMAIL_ADDRESS:-}"

      # GaryCorp specialists (Susan, Dave, Linda, Catherine, Lauren). Empty model = PLANNING_MODEL.
      GARY_EMPLOYEE_MODEL: "${GARY_EMPLOYEE_MODEL:-}"
      AGENT_WEB_SEARCH_MODEL: "${AGENT_WEB_SEARCH_MODEL:-gpt-5.6-luna}"
      MAX_AGENT_ITERATIONS: "${MAX_AGENT_ITERATIONS:-8}"
      MAX_AGENT_EXECUTION_SECONDS: "${MAX_AGENT_EXECUTION_SECONDS:-300}"
      MAX_CONCURRENT_AGENT_RUNS: "${MAX_CONCURRENT_AGENT_RUNS:-2}"
      MAX_ASSIGNMENTS_PER_GARY_PLAN: "${MAX_ASSIGNMENTS_PER_GARY_PLAN:-6}"
      MAX_ACTIVE_AGENT_ASSIGNMENTS: "${MAX_ACTIVE_AGENT_ASSIGNMENTS:-6}"
      CFO_PER_PURCHASE_LIMIT_USD: "${CFO_PER_PURCHASE_LIMIT_USD:-50}"
      CFO_MONTHLY_LIMIT_USD: "${CFO_MONTHLY_LIMIT_USD:-200}"
      # Engineering tickets in the PRIVATE GaryCorp repository and Project.
      # Empty GITHUB_TOKEN = the engineering tools report "unavailable".
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_OWNER: "${GITHUB_OWNER:-}"
      GITHUB_REPOSITORY: "${GITHUB_REPOSITORY:-}"
      GITHUB_PROJECT_NUMBER: "${GITHUB_PROJECT_NUMBER:-}"
      GITHUB_ENGINEER_USERNAME: "${GITHUB_ENGINEER_USERNAME:-}"
      GITHUB_SYNC_INTERVAL_MINUTES: "${GITHUB_SYNC_INTERVAL_MINUTES:-}"

      # Lauren's EASE ethics framework (the ease-api service below).
      EASE_API_URL: "${EASE_API_URL-http://ease-api:8000}"
      EASE_API_KEY: "${EASE_API_KEY:-}"
      # CrewAI: no telemetry or hosted tracing; its scratch storage stays in
      # the container and is not part of GaryCorp's records.
      CREWAI_DISABLE_TELEMETRY: "true"
      CREWAI_DISABLE_TRACKING: "true"
      CREWAI_DISABLE_VERSION_CHECK: "true"
      CREWAI_TRACING_ENABLED: "false"
      OTEL_SDK_DISABLED: "true"
      CREWAI_STORAGE_DIR: /tmp/crewai

      CLIENT_SECRETS_FILE: /run/secrets/google_client_secret.json
      TOKEN_STORE_FILE: /data/token_store.enc
      CARD_VAULT_FILE: /data/card_vault.enc
      REDIRECT_URI: http://localhost:8000/oauth2callback

      # The OAuth callback is plain http on host loopback only (127.0.0.1:8000).
      OAUTHLIB_INSECURE_TRANSPORT: "1"
      # Google may return previously granted scopes (include_granted_scopes).
      OAUTHLIB_RELAX_TOKEN_SCOPE: "1"

    volumes:
      - type: bind
        source: ./client_secret.json
        target: /run/secrets/google_client_secret.json
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false

    ports:
      - "127.0.0.1:8000:8000"

    networks:
      assistant_net:
        aliases:
          - backend

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 256
    # CrewAI and two concurrent specialist runs need more than the original 768m.
    mem_limit: 1536m
    cpus: 1.50

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  voice:
    build:
      context: ./voice
      args:
        APP_UID: "${HOST_UID:-1000}"
        APP_GID: "${HOST_GID:-1000}"
        WHISPER_MODEL: "${WHISPER_MODEL:-base.en}"
        PIPER_VOICE: "${PIPER_VOICE:-en_US-ryan-medium}"

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    environment:
      BACKEND_WS_URL: ws://backend:8000/internal/voice
      VOICE_BRIDGE_TOKEN: "${VOICE_BRIDGE_TOKEN:?Run bash setup.sh}"

      WHISPER_MODEL_PATH: "/models/${WHISPER_MODEL:-base.en}"
      PIPER_VOICE_PATH: "/models/piper/${PIPER_VOICE:-en_US-ryan-medium}.onnx"
      PIPER_LENGTH_SCALE: "${PIPER_LENGTH_SCALE:-1.0}"
      WAKE_WORD: "${WAKE_WORD:-gary}"
      AUDIO_DEVICE: "${AUDIO_DEVICE:-}"

      PRE_ROLL_SECONDS: "${PRE_ROLL_SECONDS:-1.8}"
      WAKE_WINDOW_SECONDS: "${WAKE_WINDOW_SECONDS:-2.2}"
      WAKE_CHECK_INTERVAL_SECONDS: "${WAKE_CHECK_INTERVAL_SECONDS:-1.25}"

      ACTIVE_SESSION_SECONDS: "${ACTIVE_SESSION_SECONDS:-45}"
      FOLLOWUP_GRACE_SECONDS: "${FOLLOWUP_GRACE_SECONDS:-10}"

      # Must match the backend's VOICE_MODE.
      VOICE_MODE: "${VOICE_MODE:-transcribe}"
      UTTERANCE_SILENCE_SECONDS: "${UTTERANCE_SILENCE_SECONDS:-1.2}"
      UTTERANCE_ENERGY: "${UTTERANCE_ENERGY:-0.006}"
      MAX_UTTERANCE_SECONDS: "${MAX_UTTERANCE_SECONDS:-30}"

      PULSE_SERVER: unix:/run/pulse/native

    # Host PipeWire/PulseAudio socket. Raw /dev/snd access fails for playback
    # because the host sound server already holds the output device.
    volumes:
      - type: bind
        source: "/run/user/${HOST_UID:-1000}/pulse/native"
        target: /run/pulse/native
        bind:
          create_host_path: false

    networks:
      - assistant_net

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 128
    mem_limit: 1400m
    cpus: 2.00

  # Joplin desktop listens only on the host's 127.0.0.1. This forwards the
  # assistant network's gateway address to it, for the backend only.
  joplin-proxy:
    image: python:3.12-slim

    restart: unless-stopped

    command: ["python", "/app/joplin_proxy.py"]

    network_mode: host

    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    environment:
      LISTEN_HOST: "${ASSISTANT_GATEWAY:-172.30.99.1}"
      LISTEN_PORT: "41184"
      JOPLIN_PORT: "41184"
      ALLOWED_SUBNET: "${ASSISTANT_SUBNET:-172.30.99.0/24}"

    volumes:
      - type: bind
        source: ./joplin_proxy/joplin_proxy.py
        target: /app/joplin_proxy.py
        read_only: true
        bind:
          create_host_path: false

    # Starting after the backend guarantees the gateway address exists.
    depends_on:
      - backend

    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25

  # EASE ethical decision-making API (EASE/). Reachable from the host at
  # http://localhost:8002 and from other services at http://ease-api:8000.
  ease-api:
    build:
      context: ./EASE
      dockerfile: Dockerfile.prod

    restart: unless-stopped

    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]

    depends_on:
      ease-redis:
        condition: service_healthy

    environment: &ease_env
      # Defaults to OpenAI with the key Gary already uses. For Anthropic or
      # Google set EASE_LLM_PROVIDER, EASE_LLM_API_KEY and EASE_LLM_MODEL.
      LLM_PROVIDER: "${EASE_LLM_PROVIDER:-openai}"
      LLM_API_KEY: "${EASE_LLM_API_KEY:-${OPENAI_API_KEY}}"
      LLM_MODEL: "${EASE_LLM_MODEL:-gpt-5.6-luna}"
      # Empty = no auth. Set it if anything beyond localhost can reach the API.
      API_KEY: "${EASE_API_KEY:-}"
      REDIS_URL: redis://ease-redis:6379/0

    ports:
      - "127.0.0.1:8002:8000"

    networks:
      - assistant_net

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 128
    mem_limit: 768m
    cpus: 1.00

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Runs pipelines submitted to /api/v1/ease/submit.
  ease-worker:
    build:
      context: ./EASE
      dockerfile: Dockerfile.worker

    restart: unless-stopped

    command: ["celery", "-A", "src.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]

    depends_on:
      ease-redis:
        condition: service_healthy

    environment: *ease_env

    networks:
      - assistant_net

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 128
    mem_limit: 768m
    cpus: 1.00

  ease-redis:
    image: redis:7-alpine

    restart: unless-stopped

    networks:
      - assistant_net

    security_opt:
      - no-new-privileges:true

    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  assistant_net:
    driver: bridge
    # Fixed subnet so a VPN allowlist entry (e.g. NordVPN) keeps working when
    # the network is recreated. See docs/TROUBLESHOOTING.md.
    ipam:
      config:
        - subnet: "${ASSISTANT_SUBNET:-172.30.99.0/24}"
          gateway: "${ASSISTANT_GATEWAY:-172.30.99.1}"